---
# Run Python on this laptop. No extra servers needed.
- name: Lesson — Python then Ansible
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lesson_dir: "{{ playbook_dir }}"
  tasks:
    - name: Run the 10-line Python script
      ansible.builtin.command: python3 "{{ lesson_dir }}/hello_status.py"
      environment:
        PLACE: Bengaluru
      register: py_result

    - name: Show the raw stdout from Python
      ansible.builtin.debug:
        var: py_result.stdout

    - name: Show the JSON as a dictionary
      ansible.builtin.debug:
        var: py_result.stdout | from_json
